apiVersion: 1

datasources:
  - name: Zipkin
    type: zipkin
    uid: zipkin
    access: proxy
    url: http://zipkin:9411

  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: 'traceId\W+(\w{32})'
          datasourceUid: zipkin
          url: '$${__value.raw}'
          urlDisplayLabel: Ver trace