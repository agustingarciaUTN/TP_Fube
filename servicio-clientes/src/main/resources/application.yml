server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

statsig:
  secret-key: ${STATSIG_SECRET_KEY}

servicios:
  pedidos:
    url: http://localhost:8083