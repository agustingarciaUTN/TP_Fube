services:
    db-clientes:
      image: postgres:15
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: clientes_db

      ports:
        - "5432:5432"

    db-inventario:
      image: postgres:15
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: inventario_db

      ports:
        - "5433:5432"

    db-pedidos:
      image: postgres:15
      environment:
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: pedidos_db

      ports:
        - "5434:5432"

    zipkin:
      image: openzipkin/zipkin:3
      ports:
        - "9411:9411"

    loki:
      image: grafana/loki:3.2.0
      ports:
        - "3100:3100"

    grafana:
      image: grafana/grafana:11.3.0
      ports:
        - "3000:3000"
      environment:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      volumes:
        - ./observabilidad/grafana/provisioning:/etc/grafana/provisioning:ro